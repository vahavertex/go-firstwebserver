<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Go Сервер version B</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        h1 { color: #0078d4; margin-bottom: 10px; }
        h2 { color: #27d617; margin-bottom: 5px; }
        p { color: #666; font-size: 1.1em; }
        .path { font-family: monospace; background: #eee; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Привет из Go! 🚀</h1>
        <h2>Version B</h2>
        <!-- Переменная .Path придет из нашего Go-кода -->
        <p>Вы успешно запросили страницу: <span class="path">{{.Path}}</span></p>
    </div>
</body>
</html>
